project:
  name: "cbpe_2026_garagem_onibus_biogas_b2"
  version: "1.0.0-b2-50-baseline"
  description: >
    Caso base B2-50 para microrrede de garagem de ônibus com PV,
    BESS de segunda vida e biogás near-site produzido por digestão
    anaeróbia de resíduos alimentares/FORSU segregada, armazenado
    em gasômetro de baixa pressão e convertido em eletricidade por CHP.
    A formulação tarifária segue o caso harmonizado M1b, com cobrança
    mensal de demanda internalizada no despacho.
  timezone: "America/Sao_Paulo"


# ============================================================
# SYSTEM
# ============================================================

system:
  route: "biogas"


# ============================================================
# REPRODUCIBILITY
# ============================================================

reproducibility:
  seed: 42
  save_config_snapshot: true
  save_input_hash: true

  solver_name: "SCIP"
  solver_time_limit_sec: 90
  solver_mip_gap: 0.001


# ============================================================
# DATA
# ============================================================

data:
  demand_profile_csv: "data/processed/fleet_demand_sp.csv"

  required_columns:
    - "demand_kw"
    - "pv_factor"
    - "hour"

  timestep_hours: 1.0
  horizon_hours: 8760


# ============================================================
# TARIFF — HARMONIZED M1b
# ============================================================

tariff:
  pricing_model: "two_tier"
  used_in_milp_objective: true

  peak_window:
    start_hour: 18
    end_hour: 21

  offpeak_price_usd_kwh: 0.15
  peak_price_usd_kwh: 0.50

  tariff_timeseries_csv: null
  tariff_column_name: null

  include_demand_charge: true
  demand_charge_usd_kw_month: 30.0
  demand_charge_in_milp_objective: true


# ============================================================
# MILP OBJECTIVE / PENALTIES
# ============================================================

objective:
  peak_penalty_multiplier: 1.0

  # Preserved from the validated H2/M1b formulation.
  global_peak_penalty_weight: 1.0

  curtailment_penalty_usd_kwh: 0.01

  # Explicitly preserved from the H2 control formulation.
  battery_discharge_penalty_usd_kwh: 0.005


# ============================================================
# RELIABILITY
# ============================================================

reliability:
  # Unserved energy remains mathematically available for
  # diagnostic purposes, but the validation gate requires EENS = 0.
  allow_unserved: true
  unserved_penalty_usd_kwh: 10000.0

  eens_tolerance_kwh: 0.0


# ============================================================
# ECONOMICS — COMMON + B2
# ============================================================

economics:
  currency_base: "USD"
  analysis_horizon_years: 20
  wacc_real: 0.08

  include_salvage_value: false
  salvage_fraction_default: 0.0

  lcoe_definition:
    includes_grid_energy_opex: true
    includes_fixed_opex: true
    includes_degradation_cost: false
    includes_demand_charge: true

  # ----------------------------------------------------------
  # CAPEX
  # ----------------------------------------------------------

  capex:

    # --------------------------------------------------------
    # COMMON INFRASTRUCTURE
    # --------------------------------------------------------

    pv_usd_per_kw: 1000.0

    bsv_module_usd_per_kwh: 120.0
    bsv_repurpose_usd_per_kwh: 60.0
    bsv_integration_usd_per_kwh: 40.0

    # --------------------------------------------------------
    # B2 — ANAEROBIC DIGESTION
    # --------------------------------------------------------

    # Baseline B2-2026 — Block C.
    # Boundary excludes CHP and biogas storage.
    anaerobic_digestion_usd_per_t_year_capacity: 630.0

    # --------------------------------------------------------
    # B2 — BIOGAS STORAGE
    # --------------------------------------------------------

    # Double-membrane, low-pressure gas holder.
    biogas_storage_usd_per_m3: 150.0

    # --------------------------------------------------------
    # B2 — CHP 50 kW
    # --------------------------------------------------------

    # Baseline B2-2026 — Block D.
    chp_biogas_usd_per_kw: 3500.0


  # ----------------------------------------------------------
  # FIXED OPEX
  # ----------------------------------------------------------

  opex_fixed:

    # Common
    pv_fraction_of_capex_per_year: 0.01
    bsv_fraction_of_capex_per_year: 0.02

    # CHP non-fuel O&M is represented as variable OPEX below
    # to avoid double counting.
    chp_biogas_fraction_of_capex_per_year: 0.00


  # ----------------------------------------------------------
  # VARIABLE B2 OPEX
  # ----------------------------------------------------------

  opex_variable_biogas:

    # Anaerobic digestion operating cost.
    anaerobic_digestion_usd_per_t_substrate: 60.0

    # CHP non-fuel variable O&M.
    chp_usd_per_kwh_gross: 0.020

    # Aggregated equivalent logistics of substrate collection
    # and transport to the near-site AD facility.
    transport_usd_per_t_km: 0.40
    transport_distance_km: 10.0

    # Baseline assumes neither substrate purchase cost
    # nor gate-fee revenue.
    substrate_usd_per_t: 0.0
    gate_fee_usd_per_t: 0.0


  # ----------------------------------------------------------
  # REVENUES / CREDITS
  # ----------------------------------------------------------

  credits:

    # Heat is physically calculated but is not monetized
    # in the 2026 baseline.
    heat_credit_enabled: false
    heat_credit_usd_per_kwh_th: 0.0

    # Digestate is recognized materially but no revenue
    # is assigned in the baseline.
    digestate_credit_enabled: false
    digestate_credit_usd_per_t: 0.0


# ============================================================
# TECHNOLOGY
# ============================================================

technology:

  # ----------------------------------------------------------
  # BATTERY — IDENTICAL TO H2 CONTROL
  # ----------------------------------------------------------

  battery:
    soc_init_fraction: 0.50
    min_soc_fraction: 0.10

    c_rate_max: 0.90

    soh_initial: 0.80
    usable_soc_window: 0.80

    battery_roundtrip: 0.85


  # ----------------------------------------------------------
  # BIOGAS B2 — AGGREGATED PHYSICAL MODEL
  # ----------------------------------------------------------

  biogas:

    substrate_reference: "food_waste_segregated_forsu"

    # --------------------------------------------------------
    # B2-50 RESOURCE REQUIREMENT
    # --------------------------------------------------------
    #
    # Derived from the consolidated B2-2026 pre-sizing:
    #
    # CHP net programmed energy:
    # 50 kW × 3 h/day = 150 kWh/day
    #
    # CH4 yield:
    # 60 Nm3 CH4/t wet substrate
    #
    # CH4 fraction:
    # 0.60
    #
    # Biogas yield:
    # 60 / 0.60 = 100 Nm3/t
    #
    # CH4 LHV:
    # 9.94 kWh/Nm3
    #
    # Biogas LHV:
    # 0.60 × 9.94 = 5.964 kWh/Nm3
    #
    # CHP eta_el:
    # 0.33
    #
    # Aggregated parasitic consumption:
    # 10% of gross electric generation.
    #
    # Net electric yield:
    # 60 × 9.94 × 0.33 × 0.90
    # = 177.1308 kWh_e/t
    #
    # Substrate:
    # 150 / 177.1308
    # = 0.8468318327473257 t/day
    #
    substrate_t_day: 0.8468318327473257

    # Primary conversion parameter.
    methane_yield_nm3_per_t: 60.0

    methane_fraction: 0.60

    # Derived:
    # 60 / 0.60 = 100 Nm3 biogas/t.
    biogas_yield_nm3_per_t: 100.0

    methane_lhv_kwh_per_nm3: 9.94

    # Derived:
    # 0.60 × 9.94 = 5.964 kWh/Nm3 biogas.
    lhv_kwh_per_nm3: 5.964

    # Aggregated auxiliary consumption of the B2 chain.
    # Consolidated central hypothesis: 10%.
    parasitic_fraction: 0.10

    # For the first B2 implementation, anaerobic digestion
    # is represented by a constant average hourly biogas production.
    production_mode: "constant_daily_average"


  # ----------------------------------------------------------
  # BIOGAS STORAGE — GAS HOLDER
  # ----------------------------------------------------------

  biogas_storage:

    technology: "double_membrane_low_pressure"

    soc_init_fraction: 0.50

    soc_min_fraction: 0.05
    soc_max_fraction: 0.80

    # Useful storage window:
    # 0.80 - 0.05 = 0.75
    usable_soc_window: 0.75

    # The physical intention is to prevent the annual model
    # from consuming the initial gas inventory as free energy.
    # This condition must be imposed only at the end of the
    # annual horizon, not at the end of every 24 h MILP block.
    enforce_terminal_cyclic_state: true


  # ----------------------------------------------------------
  # BIOGAS CHP — B2-50
  # ----------------------------------------------------------

  chp_biogas:

    # Block D consolidated value for 50 kW.
    eta_el: 0.33

    # Representative thermal efficiency.
    # Heat is reported but not monetized.
    eta_th: 0.48

    # Annual technical availability parameter.
    #
    # IMPORTANT:
    # This value must NOT automatically be interpreted
    # as continuous power derating (50 × 0.96).
    # Its temporal implementation in the 8760 h MILP
    # must be handled explicitly.
    availability_fraction: 0.96

    # CHP can be off or operate at >= 50% nominal load.
    min_load_fraction: 0.50

    heat_credit_enabled: false
    heat_credit_usd_per_kwh_th: 0.0


# ============================================================
# DEGRADATION — PRESERVED FROM H2 CONTROL
# ============================================================

degradation:
  enabled: true
  model: "DegradationCostManager"

  cost_unit: "usd_per_kwh_throughput_proxy"

  default_dod_for_cost: 0.50
  default_temp_c_if_missing: 25.0

  include_in_objective: true
  report_separately: true


# ============================================================
# FIXED B2-50 VALIDATION CASE
# ============================================================

fixed_case:
  enabled: true

  # ----------------------------------------------------------
  # COMMON INFRASTRUCTURE
  # ----------------------------------------------------------
  #
  # Frozen at the definitive H2 benchmark values
  # to preserve comparability during the B2 physical gate.
  #
  pv_kw: 990.0
  bsv_kwh: 1241.0

  # ----------------------------------------------------------
  # B2-50
  # ----------------------------------------------------------

  chp_kw: 50.0

  # Consolidated B2-50 derived gas-holder size:
  #
  # Biogas production:
  # 0.8468318327473257 × 100
  # = 84.68318327473257 Nm3/day
  #
  # Nominal gas holder:
  # 84.68318327473257 / 0.75
  # = 112.91091103297676 m3
  #
  biogas_storage_nm3: 112.91091103297676


# ============================================================
# OPTIMIZATION / DISPATCH
# ============================================================

optimization:

  # Same rolling horizon validated for H2/M1b.
  pareto_period_hours: 24
  single_case_period_hours: 24

  grid_power_max_kw: 5000.0

  # Retained for future migration to NSGA-II after
  # the B2 fixed physical/economic case is validated.
  objective:
    - "lcoe_usd_kwh"
    - "P_peak_grid_opt_kw"


# ============================================================
# B2 VALIDATION GATES
# ============================================================

validation:

  # ----------------------------------------------------------
  # RELIABILITY
  # ----------------------------------------------------------

  require_zero_eens: true
  eens_tolerance_kwh: 0.0

  # ----------------------------------------------------------
  # ELECTRICAL BALANCE
  # ----------------------------------------------------------

  check_electric_balance: true
  electric_balance_tolerance_kw: 1.0e-6

  # ----------------------------------------------------------
  # BIOGAS MASS / VOLUME BALANCE
  # ----------------------------------------------------------

  check_biogas_balance: true
  biogas_balance_tolerance_nm3: 1.0e-6

  # ----------------------------------------------------------
  # STORAGE
  # ----------------------------------------------------------

  check_storage_bounds: true
  check_terminal_storage_state: true

  # ----------------------------------------------------------
  # CHP
  # ----------------------------------------------------------

  check_chp_min_load: true

  # ----------------------------------------------------------
  # ANNUAL RESOURCE CONSERVATION
  # ----------------------------------------------------------

  check_annual_biogas_conservation: true


# ============================================================
# PARAMETER STATUS / TRACEABILITY
# ============================================================

parameter_status:

  substrate_reference:
    status: "baseline_B2_2026"
    nature: "model_boundary"

  methane_yield_nm3_per_t:
    status: "baseline_B2_2026_block_A"
    nature: "reported_synthesis"

  methane_fraction:
    status: "baseline_B2_2026_block_A"
    nature: "reported_synthesis"

  biogas_yield_nm3_per_t:
    status: "baseline_B2_2026_block_A"
    nature: "derived"

  methane_lhv_kwh_per_nm3:
    status: "baseline_B2_2026"
    nature: "physical_constant"

  lhv_kwh_per_nm3:
    status: "baseline_B2_2026_block_A"
    nature: "derived"

  substrate_t_day:
    status: "baseline_B2_2026_block_B"
    nature: "derived"

  anaerobic_digestion_capex:
    status: "baseline_B2_2026_block_C"
    nature: "synthesis_assumption"

  anaerobic_digestion_opex:
    status: "baseline_B2_2026_block_C"
    nature: "synthesis_assumption"

  biogas_storage_capex:
    status: "baseline_B2_2026_block_C"
    nature: "synthesis_assumption"

  biogas_storage_nm3:
    status: "baseline_B2_2026_block_B"
    nature: "derived"

  transport_cost:
    status: "baseline_B2_2026_block_C"
    nature: "reported_converted"

  transport_distance:
    status: "baseline_B2_2026_block_C"
    nature: "modeling_assumption"

  parasitic_fraction:
    status: "baseline_B2_2026_block_C"
    nature: "modeling_assumption"

  chp_eta_el:
    status: "baseline_B2_2026_block_D"
    nature: "reported_synthesis"

  chp_eta_th:
    status: "baseline_B2_2026_block_D"
    nature: "representative"

  chp_min_load_fraction:
    status: "baseline_B2_2026_block_D"
    nature: "technical_assumption"

  chp_availability_fraction:
    status: "baseline_B2_2026_block_D"
    nature: "reported_synthesis"

  chp_capex:
    status: "baseline_B2_2026_block_D"
    nature: "reported_synthesis"

  chp_variable_opex:
    status: "baseline_B2_2026_block_D"
    nature: "reported_synthesis"

  economic_boundary:
    status: "baseline_B2_2026"
    nature: "model_boundary"

  heat_credit:
    status: "disabled_in_baseline"
    nature: "conservative_modeling_choice"

  digestate_credit:
    status: "disabled_in_baseline"
    nature: "conservative_modeling_choice"