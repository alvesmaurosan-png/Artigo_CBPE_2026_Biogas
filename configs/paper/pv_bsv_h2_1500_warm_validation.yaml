project:
  name: "cbpe_xv_garagem_onibus_no_h2_controlled"
  version: "0.6.0-no-h2"
  description: "CenÃ¡rio controlado sem H2: microrrede com PV e BESS de segunda vida"
  timezone: "America/Sao_Paulo"

reproducibility:
  seed: 42
  save_config_snapshot: true
  save_input_hash: true
  solver_name: "SCIP"
  solver_time_limit_sec: 90
  solver_mip_gap: 0.001

data:
  demand_profile_csv: "data/processed/fleet_demand_sp.csv"
  required_columns:
    - "demand_kw"
    - "pv_factor"
    - "hour"
  timestep_hours: 1.0
  horizon_hours: 8760

tariff:
  pricing_model: "two_tier"
  used_in_milp_objective: true

  peak_window:
    start_hour: 18
    end_hour: 21

  offpeak_price_usd_kwh: 0.15
  peak_price_usd_kwh: 0.50

  tariff_timeseries_csv: null
  tariff_column_name: null

  include_demand_charge: true
  demand_charge_usd_kw_month: 30.0

objective:
  peak_penalty_multiplier: 1.0
  curtailment_penalty_usd_kwh: 0.01
  global_peak_penalty_weight: 1.0

economics:
  currency_base: "USD"
  analysis_horizon_years: 20
  wacc_real: 0.08

  include_salvage_value: false
  salvage_fraction_default: 0.0

  lcoe_definition:
    includes_grid_energy_opex: true
    includes_fixed_opex: true
    includes_degradation_cost: false

  capex:
    pv_usd_per_kw: 1000.0

    bsv_module_usd_per_kwh: 120.0
    bsv_repurpose_usd_per_kwh: 60.0
    bsv_integration_usd_per_kwh: 40.0

    electrolyzer_usd_per_kw: 2000.0
    h2_tank_usd_per_kg: 600.0
    fuelcell_usd_per_kw: 1300.0

  opex_fixed:
    pv_fraction_of_capex_per_year: 0.01
    bsv_fraction_of_capex_per_year: 0.02
    electrolyzer_fraction_of_capex_per_year: 0.02
    fuelcell_fraction_of_capex_per_year: 0.03
    h2_tank_fraction_of_capex_per_year: 0.01

  opex_variable_h2:
    electrolyzer_usd_kwh: 0.005
    fuelcell_usd_kwh: 0.010

technology:
  efficiencies:
    electrolyzer: 0.70
    fuelcell: 0.50

  hydrogen:
    lhv_kwh_per_kg: 33.33

  battery:
    soc_init_fraction: 0.50
    min_soc_fraction: 0.10
    c_rate_max: 0.90
    soh_initial: 0.80
    usable_soc_window: 0.80
    battery_roundtrip: 0.85

  h2_storage:
    soc_init_fraction: 0.50

degradation:
  enabled: true
  model: "DegradationCostManager"
  cost_unit: "usd_per_kwh_throughput_proxy"
  default_dod_for_cost: 0.50
  default_temp_c_if_missing: 25.0
  include_in_objective: true
  report_separately: true

optimization:
  objective:
    - "lcoe_usd_kwh"
    - "P_peak_grid_opt_kw"

  pareto_period_hours: 24
  single_case_period_hours: 24
  total_grid_dependency_weight: 0.15

  constraints:
    pv_kw:
      min: 0.0
      max: 1200

    bsv_kwh:
      min: 0.0
      max: 1500

    electrolyzer_kw:
      min: 0.0
      max: 500

    h2_tank_kg:
      min: 0.0
      max: 300

    fuelcell_kw:
      min: 0.0
      max: 500

  grid_power_max_kw: 5000.0

selection:
  mode: "min_lcoe"

ga:
  algorithm: "NSGA-II"
  population: 48
  generations: 5
  crossover_prob: 0.90
  mutation_prob: 0.10
  tournament_size: 2
  integer_variables: true

  decision_variables:
    - "pv_kw"
    - "bsv_kwh"
    - "electrolyzer_kw"
    - "h2_tank_kg"
    - "fuelcell_kw"
# ------------------------------------------------------------
# WARM START - H2
# Seeds provenientes de soluções previamente avaliadas
# ------------------------------------------------------------
warm_start:
  enabled: true
  seeds:
    - pv_kw: 1000
      bsv_kwh: 924
      electrolyzer_kw: 450
      h2_tank_kg: 205
      fuelcell_kw: 117

    - pv_kw: 847
      bsv_kwh: 1289
      electrolyzer_kw: 485
      h2_tank_kg: 140
      fuelcell_kw: 111

    - pv_kw: 940
      bsv_kwh: 1267
      electrolyzer_kw: 407
      h2_tank_kg: 128
      fuelcell_kw: 105

    - pv_kw: 938
      bsv_kwh: 1319
      electrolyzer_kw: 399
      h2_tank_kg: 106
      fuelcell_kw: 100