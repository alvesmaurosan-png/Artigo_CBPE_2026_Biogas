project:
  name: "cbpe_xv_garagem_onibus_biomethane_chp"
  version: "0.7.0-biomethane-b1"
  description: "Caso-base comparativo PV + BSV + biometano comprimido + armazenamento + CHP"
  timezone: "America/Sao_Paulo"

system:
  route: "biomethane"

reproducibility:
  seed: 42
  save_config_snapshot: true
  save_input_hash: true
  solver_name: "SCIP"
  solver_time_limit_sec: 90
  solver_mip_gap: 0.001

data:
  demand_profile_csv: "data/processed/fleet_demand_sp.csv"
  required_columns:
    - "demand_kw"
    - "pv_factor"
    - "hour"
  timestep_hours: 1.0
  horizon_hours: 8760

tariff:
  pricing_model: "two_tier"
  used_in_milp_objective: true

  peak_window:
    start_hour: 18
    end_hour: 21

  offpeak_price_usd_kwh: 0.15
  peak_price_usd_kwh: 0.50

  tariff_timeseries_csv: null
  tariff_column_name: null

  include_demand_charge: true
  demand_charge_usd_kw_month: 30.0

objective:
  peak_penalty_multiplier: 1.0
  curtailment_penalty_usd_kwh: 0.01
  global_peak_penalty_weight: 1.0

economics:
  currency_base: "USD"
  monetary_base: "2026-06"
  fx_brl_per_usd: 5.1276

  analysis_horizon_years: 20
  wacc_real: 0.08

  include_salvage_value: false
  salvage_fraction_default: 0.0

  lcoe_definition:
    includes_grid_energy_opex: true
    includes_fixed_opex: true
    includes_degradation_cost: false

  capex:
    pv_usd_per_kw: 1000.0

    bsv_module_usd_per_kwh: 120.0
    bsv_repurpose_usd_per_kwh: 60.0
    bsv_integration_usd_per_kwh: 40.0

    biomethane_storage_usd_per_nm3: 162.0
    chp_usd_per_kw: 4160.0

  opex_fixed:
    pv_fraction_of_capex_per_year: 0.01
    bsv_fraction_of_capex_per_year: 0.02
    biomethane_storage_fraction_of_capex_per_year: 0.01
    chp_fraction_of_capex_per_year: 0.00

  opex_variable_biomethane:
    biomethane_usd_per_nm3: 0.7099
    chp_usd_per_kwh: 0.0344

  price_sensitivity_biomethane:
    low_usd_per_nm3: 0.5266
    base_usd_per_nm3: 0.7099
    high_usd_per_nm3: 0.8913

technology:
  biomethane:
    lhv_kwh_per_nm3: 10.19
    methane_fraction: 0.965
    max_supply_nm3_day: 200.0

  biomethane_storage:
    soc_init_fraction: 0.50
    soc_min_fraction: 0.00
    lifetime_years: 20
    enforce_terminal_cyclic_state: true

  chp:
    eta_el: 0.385
    lifetime_years: 20
    availability_fraction: 1.00
    heat_credit_enabled: false
    heat_credit_usd_per_kwh_th: 0.0

  battery:
    soc_init_fraction: 0.50
    min_soc_fraction: 0.10
    c_rate_max: 0.90
    soh_initial: 0.80
    usable_soc_window: 0.80
    battery_roundtrip: 0.85

delivery:
  enabled: true
  hour: 17
  max_nm3_per_day: 200.0
  optimize_delivery_volume: true
  max_deliveries_per_day: 1

degradation:
  enabled: true
  model: "DegradationCostManager"
  cost_unit: "usd_per_kwh_throughput_proxy"
  default_dod_for_cost: 0.50
  default_temp_c_if_missing: 25.0
  include_in_objective: true
  report_separately: true

optimization:
  objective:
    - "lcoe_usd_kwh"
    - "P_peak_grid_opt_kw"

  pareto_period_hours: 24
  single_case_period_hours: 24
  total_grid_dependency_weight: 0.15

  constraints:
    pv_kw:
      min: 0.0
      max: 1200

    bsv_kwh:
      min: 0.0
      max: 1500

    biomethane_storage_nm3:
      min: 0.0
      max: 400

    chp_kw:
      min: 0.0
      max: 200

  grid_power_max_kw: 5000.0

selection:
  mode: "min_lcoe"

ga:
  algorithm: "NSGA-II"
  population: 48
  generations: 30
  crossover_prob: 0.90
  mutation_prob: 0.10
  tournament_size: 2
  integer_variables: true

  decision_variables:
    - "pv_kw"
    - "bsv_kwh"
    - "biomethane_storage_nm3"
    - "chp_kw"